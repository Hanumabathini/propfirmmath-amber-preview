name: build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pre-render every route (fails if a listed page renders empty or errors)
        run: npm run build
      - name: Journal behavior checks
        run: node scripts/test-journal.js
      - name: Terra motion and interactive behavior checks
        run: node scripts/test-terra-motion.js
      - name: Smoke-check output
        run: |
          test -f dist/404.html
          test -f dist/firm/ftmo.html
          test -f dist/faq.html
          test $(ls dist/firm | wc -l) -ge 48
