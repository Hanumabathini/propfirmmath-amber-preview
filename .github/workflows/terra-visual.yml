name: Terra rendered QA
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - scripts/test-terra-browser.cjs
      - .github/workflows/terra-visual.yml
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-terra-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terra-rendered-screenshots
          path: visual-qa/
          if-no-files-found: warn
